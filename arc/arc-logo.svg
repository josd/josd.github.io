<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 245 1320 530" role="img" aria-labelledby="title desc">
  <title id="title">ARC — Answer, Reason, Check</title>
  <desc id="desc">A luminous cyan and gold ARC logo with an abstract eye-shaped reasoning emblem resolving into a verified answer.</desc>

  <defs>
    <linearGradient id="spectrum" x1="164" y1="395" x2="565" y2="622" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E8FF"/>
      <stop offset=".45" stop-color="#27DBDE"/>
      <stop offset=".72" stop-color="#BFE843"/>
      <stop offset="1" stop-color="#FFE700"/>
    </linearGradient>
    <linearGradient id="eye-fill" x1="181" y1="431" x2="505" y2="599" gradientUnits="userSpaceOnUse">
      <stop stop-color="#063B67"/>
      <stop offset=".5" stop-color="#063543"/>
      <stop offset="1" stop-color="#243F20"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(309 468) rotate(55) scale(119)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#147F8A"/>
      <stop offset=".55" stop-color="#124348"/>
      <stop offset="1" stop-color="#172D29"/>
    </radialGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(-10 -14) rotate(45) scale(70)" gradientUnits="objectBoundingBox">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".12" stop-color="#B7FFF2"/>
      <stop offset=".45" stop-color="#31CDB2"/>
      <stop offset="1" stop-color="#148F8A"/>
    </radialGradient>
    <linearGradient id="arc-text" x1="590" y1="393" x2="1335" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00DFFF"/>
      <stop offset=".22" stop-color="#20D4DE"/>
      <stop offset=".46" stop-color="#D7E642"/>
      <stop offset=".62" stop-color="#FFE400"/>
      <stop offset="1" stop-color="#FFD900"/>
    </linearGradient>
    <linearGradient id="arc-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset=".26" stop-color="#FFFFFF" stop-opacity=".11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="baseline" x1="596" y1="0" x2="1325" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00DFFF" stop-opacity=".65"/>
      <stop offset=".52" stop-color="#FFE500" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFE500" stop-opacity="0"/>
    </linearGradient>
    <filter id="medium-glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="small-glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="word-clip">
      <text x="590" y="590" font-family="DejaVu Sans, Arial, sans-serif" font-size="320" font-weight="400" letter-spacing="-12">ARC</text>
    </clipPath>
  </defs>

  <!-- Abstract emblem: an eye-shaped arc, a reasoning core, and one verified result. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M157 517C204 427 286 371 380 371c48 0 93 15 133 42-68-16-145 12-202 104 58 92 134 120 202 104-40 27-85 42-133 42-94 0-176-56-223-146Z"
          fill="url(#eye-fill)" stroke="#00E8FF" stroke-width="10" filter="url(#medium-glow)"/>
    <path d="M193 517c47-73 112-118 187-118 42 0 82 14 119 39-50-12-107 12-150 79 43 67 100 91 150 79-37 25-77 39-119 39-75 0-140-45-187-118Z"
          fill="none" stroke="url(#spectrum)" stroke-width="7"/>
  </g>

  <!-- Central speech/logic core. -->
  <g filter="url(#medium-glow)">
    <path d="M396 511c0 57-45 103-101 103-18 0-36-5-51-13l-44 22 20-43c-17-18-27-42-27-69 0-57 45-103 102-103 56 0 101 46 101 103Z"
          fill="url(#core)" stroke="url(#spectrum)" stroke-width="8"/>
    <path d="M211 500c7-39 39-70 78-76" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".7"/>
  </g>

  <!-- Three steps: Answer, Reason, Check. -->
  <g filter="url(#small-glow)">
    <circle cx="255" cy="511" r="13" fill="#E9FFFF" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="296" cy="511" r="13" fill="#BFEA6B" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="337" cy="511" r="13" fill="#FFE94D" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- A single reasoning path resolves into a checked result. -->
  <path d="M396 511h103" fill="none" stroke="url(#spectrum)" stroke-width="8" stroke-linecap="round" filter="url(#small-glow)"/>
  <circle cx="518" cy="511" r="39" fill="url(#orb)" stroke="#F6FFB5" stroke-width="5" filter="url(#medium-glow)"/>
  <path d="M503 496c8-10 21-13 32-8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".86"/>
  <path d="m503 511 10 10 22-27" fill="none" stroke="#FFFADF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#small-glow)"/>

  <!-- Wordmark, with a cool-to-warm split and subtle bevel. -->
  <text x="590" y="598" fill="#071311" opacity=".86" font-family="DejaVu Sans, Arial, sans-serif" font-size="320" font-weight="400" letter-spacing="-12">ARC</text>
  <text x="590" y="590" fill="url(#arc-text)" stroke="#F8F46B" stroke-opacity=".48" stroke-width="2.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="320" font-weight="400" letter-spacing="-12" filter="url(#small-glow)">ARC</text>
  <g clip-path="url(#word-clip)" opacity=".74">
    <path d="M570 350h790v68c-224-29-512-18-790 32Z" fill="url(#arc-highlight)"/>
  </g>
  <path d="M602 603h730" stroke="url(#baseline)" stroke-width="3" filter="url(#small-glow)"/>

  <g fill="#F5F8E9" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="5" text-anchor="middle">
    <text x="699" y="665">ANSWER</text>
    <text x="904" y="665">REASON</text>
    <text x="1112" y="665">CHECK</text>
  </g>
</svg>
