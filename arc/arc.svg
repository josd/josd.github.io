<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">ARC — Answer, Reason, Check</title>
  <desc id="desc">A luminous question mark flows through a reasoning arc and resolves into a check mark beside the ARC wordmark.</desc>

  <defs>
    <linearGradient id="bg" x1="60" y1="24" x2="1325" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset=".48" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <radialGradient id="blue-haze" cx="0" cy="0" r="1" gradientTransform="translate(427 133) rotate(7) scale(520 246)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#405BFF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#405BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green-haze" cx="0" cy="0" r="1" gradientTransform="translate(680 219) rotate(170) scale(280 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DE2A6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2DE2A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="journey" x1="92" y1="74" x2="696" y2="237" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FF"/>
      <stop offset=".26" stop-color="#8DD8FF"/>
      <stop offset=".62" stop-color="#727BFF"/>
      <stop offset="1" stop-color="#38E8A8"/>
    </linearGradient>
    <linearGradient id="word" x1="805" y1="80" x2="1124" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".46" stop-color="#E8EDFF"/>
      <stop offset="1" stop-color="#AFBDFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#A8B8FF" stroke-opacity=".045"/>
    </pattern>
    <filter id="panel-shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000817" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="word-clip">
      <text x="808" y="174" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="124" font-weight="850" letter-spacing="-8">ARC</text>
    </clipPath>
  </defs>

  <style>
    .flow { stroke-dasharray: 10 16; animation: flow 4s linear infinite; }
    .glint { animation: glint 5.5s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 3s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -52; } }
    @keyframes glint {
      0%, 18% { transform: translateX(-230px); opacity: 0; }
      28%, 46% { opacity: .7; }
      58%, 100% { transform: translateX(530px); opacity: 0; }
    }
    @keyframes spark { 0%, 100% { transform: scale(.82); opacity: .62; } 50% { transform: scale(1.12); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .glint, .spark { animation: none; } }
  </style>

  <!-- Deep, glassy canvas -->
  <g filter="url(#panel-shadow)">
    <rect x="10" y="10" width="1380" height="300" rx="38" fill="url(#bg)"/>
    <rect x="10" y="10" width="1380" height="300" rx="38" fill="url(#blue-haze)"/>
    <rect x="10" y="10" width="1380" height="300" rx="38" fill="url(#green-haze)"/>
    <rect x="10" y="10" width="1380" height="300" rx="38" fill="url(#grid)"/>
    <rect x="10.75" y="10.75" width="1378.5" height="298.5" rx="37.25" fill="none" stroke="#B8C7FF" stroke-opacity=".16" stroke-width="1.5"/>
    <path d="M49 11h1302" stroke="#FFF" stroke-opacity=".13" stroke-linecap="round"/>
  </g>

  <!-- Question → reasoning → checked answer: one continuous visual journey -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 142C88 92 126 60 177 60c52 0 89 28 89 70 0 33-18 52-56 72-25 13-36 29-36 51"
          stroke="#8194FF" stroke-opacity=".14" stroke-width="34"/>
    <path d="M88 142C88 92 126 60 177 60c52 0 89 28 89 70 0 33-18 52-56 72-25 13-36 29-36 51"
          stroke="url(#journey)" stroke-width="15" filter="url(#soft-glow)"/>
    <circle cx="174" cy="278" r="8" fill="#92D9FF" filter="url(#soft-glow)"/>

    <!-- The answer-seeking bend opens into the reasoning arc. -->
    <path d="M211 201C310 101 446 80 552 123c58 24 104 67 137 119"
          stroke="#7587FF" stroke-opacity=".12" stroke-width="34"/>
    <path d="M211 201C310 101 446 80 552 123c58 24 104 67 137 119"
          stroke="url(#journey)" stroke-width="15" filter="url(#glow)"/>
    <path class="flow" d="M228 190C324 110 444 98 540 136c52 21 93 57 124 102"
          stroke="#DDE6FF" stroke-opacity=".46" stroke-width="3"/>

    <!-- A quieter second route suggests independent verification. -->
    <path d="M249 222C344 167 438 162 521 192c39 14 73 35 102 63"
          stroke="#A9B7D6" stroke-opacity=".3" stroke-width="3" stroke-dasharray="2 12"/>

    <path d="M688 242l26 27 59-75" stroke="#45E5AD" stroke-opacity=".16" stroke-width="34"/>
    <path d="M688 242l26 27 59-75" stroke="url(#journey)" stroke-width="16" filter="url(#glow)"/>
  </g>

  <!-- Small proof points along the route -->
  <g fill="#DDE6FF">
    <circle cx="336" cy="127" r="3" opacity=".72"/>
    <circle cx="473" cy="111" r="3" opacity=".72"/>
    <circle cx="591" cy="147" r="3" opacity=".72"/>
  </g>
  <g class="spark" transform="translate(773 190)" stroke="#BFFFE8" stroke-linecap="round" filter="url(#soft-glow)">
    <path d="M0-10V10M-10 0H10" stroke-width="2"/>
    <path d="M-6-6 6 6M6-6-6 6" stroke-width="1" opacity=".65"/>
  </g>

  <!-- Wordmark -->
  <text x="808" y="174" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="124" font-weight="850" letter-spacing="-8">ARC</text>
  <g clip-path="url(#word-clip)" opacity=".62">
    <rect class="glint" x="760" y="52" width="120" height="148" fill="url(#shine)" transform="skewX(-18)"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="814" y="215" fill="#E1E7FF" font-size="21" font-weight="650" letter-spacing="1.4">ANSWER  ·  REASON  ·  CHECK</text>
    <text x="814" y="254" fill="#91A0C3" font-size="18" font-weight="450">Ask better questions. Get answers you can check.</text>
  </g>

  <!-- Delicate ambient stars -->
  <g fill="#B6C6FF">
    <circle cx="46" cy="59" r="1.4" opacity=".44"/>
    <circle cx="742" cy="55" r="1.2" opacity=".42"/>
    <circle cx="1267" cy="73" r="1.4" opacity=".35"/>
    <circle cx="1324" cy="247" r="1.2" opacity=".42"/>
    <circle cx="1195" cy="285" r="1" opacity=".3"/>
  </g>
</svg>
