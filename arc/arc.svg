<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">ARC — Ask better questions. Get answers you can check.</title>
  <desc id="desc">A single question stroke travels across an arc and resolves into a check mark, next to the ARC wordmark.</desc>
  <rect width="1400" height="320" rx="34" fill="#f8fafc"/>

  <!-- The idea in one mark: the question does not disappear; it travels through reasoning and resolves in a check. -->
  <g transform="translate(52 38)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- question -->
    <path d="M62 92 C62 45 101 18 145 18 C192 18 226 45 226 84 C226 119 207 137 176 153 C148 168 136 185 136 209"
          stroke="#172554" stroke-width="18"/>
    <circle cx="136" cy="244" r="11" fill="#172554" stroke="none"/>

    <!-- reasoning arc begins at the answer-seeking bend, not at the dot -->
    <path d="M176 153 C273 66 401 55 505 102 C557 125 599 162 628 202"
          stroke="#3157d5" stroke-width="18"/>

    <!-- independent check: same journey, visibly different route -->
    <path d="M203 178 C308 126 407 132 490 171 C532 191 565 217 589 245"
          stroke="#94a3b8" stroke-width="8" stroke-dasharray="1 18"/>

    <!-- resolution into a check -->
    <path d="M628 202 L657 231 L718 157" stroke="#15803d" stroke-width="20"/>
  </g>

  <g transform="translate(785 70)">
    <text x="0" y="92" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="104" font-weight="850" letter-spacing="-5" fill="#0f172a">ARC</text>
    <text x="4" y="137" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#334155">Answer · Reason · Check</text>
    <text x="4" y="181" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" fill="#64748b">Ask better questions. Get answers you can check.</text>
  </g>
</svg>
